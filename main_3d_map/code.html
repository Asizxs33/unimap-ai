<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UniMap AI — 3D первый этаж · ЮКПУ им. Ө. Жәнібекова</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #003fb1;
      --primary-strong: #1a56db;
      --primary-soft: #dbe1ff;
      --accent: #1aa57a;
      --warn: #d58b00;
      --fire: #c9232d;
      --surface: #eef2f6;
      --surface-low: #e5ebf2;
      --surface-high: #ffffff;
      --text: #0f1418;
      --muted: #5a6470;
      --shadow: 0 18px 48px rgba(15, 20, 24, .14);
      --soft-shadow: 0 12px 32px rgba(15, 20, 24, .08);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--surface);
      color: var(--text);
      overflow: hidden;
    }
    button, input { font: inherit; }
    button { border: 0; cursor: pointer; }
    .icon {
      font-family: "Material Symbols Outlined";
      font-size: 22px;
      line-height: 1;
      display: inline-flex;
      font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 24;
    }
    .app {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      height: 100vh;
    }
    .panel {
      background: var(--surface-high);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      overflow: auto;
      z-index: 5;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      width: 46px; height: 46px; border-radius: 14px; color: white;
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
      display: grid; place-items: center;
      box-shadow: 0 14px 28px rgba(0,63,177,.25); flex: 0 0 auto;
    }
    .brand h1 { margin: 0; font-size: 16px; letter-spacing: -.01em; }
    .brand small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 6px;
      min-height: 28px; padding: 0 10px; border-radius: 999px;
      color: var(--primary); background: var(--primary-soft);
      font-size: 10.5px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .05em; width: fit-content;
    }
    .nav-card {
      background: var(--surface); border-radius: 18px; padding: 14px; display: grid; gap: 10px;
    }
    .nav-card h2 { margin: 0 0 4px 0; font-size: 15px; }
    .nav-row {
      display: grid; grid-template-columns: 28px minmax(0,1fr); align-items: center;
      gap: 10px; background: var(--surface-high); border-radius: 14px;
      padding: 9px 12px; border: 1.5px solid transparent; transition: border-color .15s;
    }
    .nav-row.focused { border-color: var(--primary); }
    .nav-row .dot { width: 16px; height: 16px; border-radius: 50%; justify-self: center; }
    .nav-row .dot.from { background: #1aa57a; }
    .nav-row .dot.to { background: var(--primary); box-shadow: 0 0 0 4px rgba(0,63,177,.14); }
    .nav-row input {
      width: 100%; border: 0; outline: 0; background: transparent;
      font-size: 14px; font-weight: 600; color: var(--text); min-width: 0;
    }
    .nav-row input::placeholder { color: var(--muted); font-weight: 500; }
    .nav-actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .btn {
      min-height: 44px; border-radius: 14px; padding: 0 16px;
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; font-weight: 800; font-size: 13px;
      transition: transform .15s, box-shadow .15s, background .15s;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
      color: white; box-shadow: 0 12px 24px rgba(0,63,177,.26);
    }
    .btn-primary:hover { transform: translateY(-1px); }
    .btn-icon {
      width: 44px; height: 44px; padding: 0;
      background: var(--surface-high); color: var(--muted); box-shadow: var(--soft-shadow);
    }
    .btn-icon:hover { color: var(--primary); }
    .quick-list { display: grid; gap: 6px; }
    .quick-list h3 {
      margin: 6px 0 2px 0; font-size: 11px; color: var(--muted);
      text-transform: uppercase; letter-spacing: .06em;
    }
    .room-chip {
      display: grid; grid-template-columns: 36px minmax(0,1fr) auto;
      gap: 10px; align-items: center; padding: 9px 12px; border-radius: 14px;
      background: var(--surface); cursor: pointer; transition: background .15s;
      text-align: left; width: 100%; color: var(--text);
    }
    .room-chip:hover { background: var(--primary-soft); color: var(--primary); }
    .room-chip .num {
      width: 36px; height: 36px; border-radius: 12px; background: white;
      box-shadow: var(--soft-shadow); display: grid; place-items: center;
      font-weight: 900; color: var(--primary); font-size: 12px;
    }
    .room-chip strong { display: block; font-size: 13px; }
    .room-chip span { font-size: 11px; color: var(--muted); display: block; }
    .legend {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 5px; font-size: 11px; color: var(--muted);
    }
    .legend i {
      width: 11px; height: 11px; border-radius: 3px;
      display: inline-block; margin-right: 5px; vertical-align: middle;
    }
    .stage { position: relative; min-width: 0; }
    canvas {
      display: block; width: 100% !important; height: 100% !important; cursor: grab;
    }
    canvas:active { cursor: grabbing; }
    .overlay { position: absolute; pointer-events: none; z-index: 4; }
    .overlay > * { pointer-events: auto; }
    .topbar {
      top: 16px; left: 16px; right: 16px;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    }
    .floor-card {
      padding: 10px 14px; border-radius: 16px;
      background: rgba(255,255,255,.94); backdrop-filter: blur(14px);
      box-shadow: var(--soft-shadow); display: flex; align-items: center; gap: 10px;
    }
    .floor-card .num {
      width: 36px; height: 36px; border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
      color: white; display: grid; place-items: center; font-weight: 900; font-size: 15px;
    }
    .floor-card strong { display: block; font-size: 13px; }
    .floor-card span { display: block; font-size: 11px; color: var(--muted); }
    .view-modes {
      display: inline-flex; gap: 6px; padding: 6px; border-radius: 14px;
      background: rgba(255,255,255,.94); backdrop-filter: blur(14px);
      box-shadow: var(--soft-shadow);
    }
    .view-modes button {
      min-width: 78px; height: 36px; border-radius: 10px;
      background: transparent; color: var(--muted); font-weight: 700;
      font-size: 12px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px;
    }
    .view-modes button.active { background: var(--primary); color: white; }
    .controls { bottom: 16px; right: 16px; display: grid; gap: 7px; }
    .control-btn {
      width: 44px; height: 44px; border-radius: 14px;
      background: rgba(255,255,255,.94); backdrop-filter: blur(14px);
      box-shadow: var(--soft-shadow); color: var(--text); display: grid; place-items: center;
    }
    .control-btn:hover { color: var(--primary); }
    .step-card {
      bottom: 16px; left: 16px; padding: 14px 16px; border-radius: 18px;
      background: rgba(255,255,255,.95); backdrop-filter: blur(14px);
      box-shadow: var(--shadow); display: none; align-items: center; gap: 14px; max-width: 440px;
    }
    .step-card.show { display: flex; }
    .step-card .arrow {
      width: 44px; height: 44px; border-radius: 14px;
      background: var(--primary); color: white; display: grid; place-items: center; flex: 0 0 auto;
    }
    .step-card .arrow .icon { font-size: 24px; }
    .step-card .info { min-width: 0; flex: 1; }
    .step-card .info strong { display: block; font-size: 14px; }
    .step-card .info span { display: block; font-size: 12px; color: var(--muted); }
    .step-card .nav-step { display: inline-flex; gap: 4px; }
    .step-mini-btn {
      width: 34px; height: 34px; border-radius: 12px;
      background: var(--surface); color: var(--text); display: grid; place-items: center;
    }
    .step-mini-btn:hover { background: var(--primary-soft); color: var(--primary); }
    .toast {
      position: absolute; top: 74px; left: 50%; transform: translateX(-50%) translateY(-12px);
      padding: 9px 16px; border-radius: 999px; background: var(--text); color: white;
      font-size: 13px; font-weight: 700; opacity: 0; pointer-events: none;
      transition: opacity .25s, transform .25s; z-index: 10; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (max-width: 920px) {
      .app { grid-template-columns: 1fr; grid-template-rows: 1fr 300px; }
      .panel { order: 2; max-height: 300px; }
      .stage { order: 1; }
      .controls { right: 10px; bottom: 10px; }
      .step-card { left: 10px; right: 10px; bottom: 10px; max-width: none; }
    }
    .panel::-webkit-scrollbar { width: 5px; }
    .panel::-webkit-scrollbar-thumb { background: #cdd4dd; border-radius: 999px; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="panel">
      <div class="brand">
        <div class="brand-mark"><span class="icon">account_balance</span></div>
        <div>
          <h1>UniMap AI</h1>
          <small>ОҚМПУ им. Ө. Жәнібекова · 1 қабат</small>
        </div>
      </div>

      <div class="eyebrow"><span class="icon" style="font-size:14px">explore</span> 3D навигатор · 1-ші қабат</div>

      <div class="nav-card">
        <h2>Куда идём?</h2>
        <div class="nav-row" id="row-from">
          <span class="dot from"></span>
          <input id="from-input" placeholder="Откуда (напр.: Главный вход)" autocomplete="off">
        </div>
        <div class="nav-row focused" id="row-to">
          <span class="dot to"></span>
          <input id="to-input" placeholder="Куда (напр.: 105 — деканат)" autocomplete="off">
        </div>
        <div class="nav-actions">
          <button class="btn btn-primary" id="btn-route">
            <span class="icon">navigation</span> Построить маршрут
          </button>
          <button class="btn btn-icon" id="btn-swap" title="Поменять местами">
            <span class="icon">swap_vert</span>
          </button>
        </div>
      </div>

      <div class="quick-list">
        <h3>Быстрые места</h3>
        <button class="room-chip" data-room="entrance">
          <div class="num"><span class="icon" style="font-size:16px">door_front</span></div>
          <div><strong>Главный вход</strong><span>Южный фасад · турникеты</span></div>
          <span class="icon" style="color:var(--muted)">chevron_right</span>
        </button>
        <button class="room-chip" data-room="r101">
          <div class="num">101</div>
          <div><strong>Пожарный пост</strong><span>Левое крыло · север</span></div>
          <span class="icon" style="color:var(--muted)">chevron_right</span>
        </button>
        <button class="room-chip" data-room="r105">
          <div class="num">105</div>
          <div><strong>Деканат</strong><span>Левое крыло · юг</span></div>
          <span class="icon" style="color:var(--muted)">chevron_right</span>
        </button>
        <button class="room-chip" data-room="r110">
          <div class="num">110</div>
          <div><strong>Аудитория 110</strong><span>Левое крыло · 60 мест</span></div>
          <span class="icon" style="color:var(--muted)">chevron_right</span>
        </button>
        <button class="room-chip" data-room="r120">
          <div class="num">120</div>
          <div><strong>Аудитория 120</strong><span>Правое крыло</span></div>
          <span class="icon" style="color:var(--muted)">chevron_right</span>
        </button>
        <button class="room-chip" data-room="med">
          <div class="num"><span class="icon" style="font-size:16px;color:#17824d">medical_services</span></div>
          <div><strong>Медпункт</strong><span>Первая помощь</span></div>
          <span class="icon" style="color:var(--muted)">chevron_right</span>
        </button>
        <button class="room-chip" data-room="stairsL">
          <div class="num"><span class="icon" style="font-size:16px">stairs</span></div>
          <div><strong>Лестница (лево)</strong><span>Левое крыло · север</span></div>
          <span class="icon" style="color:var(--muted)">chevron_right</span>
        </button>
        <button class="room-chip" data-room="stairsR">
          <div class="num"><span class="icon" style="font-size:16px">stairs</span></div>
          <div><strong>Лестница (право)</strong><span>Правое крыло · север</span></div>
          <span class="icon" style="color:var(--muted)">chevron_right</span>
        </button>
        <button class="room-chip" data-room="exitL">
          <div class="num"><span class="icon" style="font-size:16px;color:var(--accent)">logout</span></div>
          <div><strong>Выход (север-лево)</strong><span>Торец левого крыла</span></div>
          <span class="icon" style="color:var(--muted)">chevron_right</span>
        </button>
        <button class="room-chip" data-room="exitR">
          <div class="num"><span class="icon" style="font-size:16px;color:var(--accent)">logout</span></div>
          <div><strong>Выход (север-право)</strong><span>Торец правого крыла</span></div>
          <span class="icon" style="color:var(--muted)">chevron_right</span>
        </button>
      </div>

      <div class="quick-list">
        <h3>Условные обозначения</h3>
        <div class="legend">
          <div><i style="background:#dbe1ff"></i>Учебные</div>
          <div><i style="background:#ffe8a3"></i>Адм./деканат</div>
          <div><i style="background:#cdebd9"></i>Сервис</div>
          <div><i style="background:#f5c4c8"></i>Тех. помещения</div>
          <div><i style="background:#1aa57a"></i>Эвак. выход</div>
          <div><i style="background:#003fb1"></i>Маршрут</div>
        </div>
      </div>
    </aside>

    <div class="stage">
      <canvas id="three"></canvas>

      <div class="overlay topbar">
        <div class="floor-card">
          <div class="num">1</div>
          <div>
            <strong>Первый этаж · 1 қабат</strong>
            <span>Эвакуациялық жоспар</span>
          </div>
        </div>
        <div class="view-modes">
          <button data-mode="ext" class="active"><span class="icon" style="font-size:16px">apartment</span> Здание</button>
          <button data-mode="iso"><span class="icon" style="font-size:16px">view_in_ar</span> План</button>
          <button data-mode="top"><span class="icon" style="font-size:16px">map</span> Сверху</button>
          <button data-mode="walk"><span class="icon" style="font-size:16px">directions_walk</span> Ходьба</button>
        </div>
      </div>

      <div class="overlay controls">
        <button class="control-btn" id="btn-zoom-in" title="Приблизить"><span class="icon">add</span></button>
        <button class="control-btn" id="btn-zoom-out" title="Отдалить"><span class="icon">remove</span></button>
        <button class="control-btn" id="btn-reset" title="Сбросить вид"><span class="icon">center_focus_strong</span></button>
        <button class="control-btn" id="btn-roof" title="Скрыть/показать крышу"><span class="icon">layers</span></button>
      </div>

      <div class="overlay step-card" id="step-card">
        <div class="arrow"><span class="icon" id="step-icon">straight</span></div>
        <div class="info">
          <strong id="step-text">—</strong>
          <span id="step-meta">—</span>
        </div>
        <div class="nav-step">
          <button class="step-mini-btn" id="step-prev"><span class="icon">arrow_back</span></button>
          <button class="step-mini-btn" id="step-next"><span class="icon">arrow_forward</span></button>
          <button class="step-mini-btn" id="step-close"><span class="icon">close</span></button>
        </div>
      </div>

      <div class="toast" id="toast">—</div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    /* ============================================================
       ПЛАН ЗДАНИЯ — точно по эвакуационной схеме (фото)
       П-образный корпус (два крыла на широком нижнем блоке):
         - ЛЕВОЕ крыло (LW): длинное вертикальное, скошенный
           северо-западный угол, выход на север
         - ПРАВОЕ крыло (RW): короче, выход на север
         - НИЖНИЙ блок (BS): широкий горизонтальный, главный
           вход/выход ШЫҒУ по центру юга, лестница на востоке
         - Перемычки между крыльями сверху НЕТ
       ============================================================ */

    /* ─── Навигационный граф ─── */

      // Главные входы/выходы
      'entrance':  { x: -8,  z: 34,  label: 'Главный вход' },
      'exitL':     { x: -47, z: -55, label: 'Выход (север-лево)' },
      'exitR':     { x: 17,  z: -45, label: 'Выход (север-право)' },

      // Коридор левого крыла (вертикальный, x≈-47)
      'corrL_1':   { x: -47, z: -46, label: 'Коридор лево N' },
      'corrL_2':   { x: -47, z: -34, label: 'Коридор лево N2' },

      'corrB_2':   { x: -28, z: 26,  label: 'Нижний коридор лево' },
      'corrB_3':   { x: -8,  z: 26,  label: 'Нижний коридор центр' },

      'corrB_6':   { x: 52,  z: 26,  label: 'Нижний коридор край' },

      // Комнаты левого крыла — западная сторона
      'r101':      { x: -53, z: -34, label: 'Каб. 101 (Пост)' },
      'r102':      { x: -53, z: -22, label: 'Каб. 102 (Гардероб)' },

      // Комнаты правого крыла
      'r121':      { x: 11,  z: -24, label: 'Ауд. 121' },
      'r123':      { x: 11,  z: -12, label: 'Ауд. 123' },

      'r120':      { x: 23,  z: -24, label: 'Ауд. 120' },
      'r122':      { x: 23,  z: -12, label: 'Ауд. 122' },
      'r124':      { x: 23,  z:   0, label: 'Ауд. 124' },

      // Нижний блок — комнаты (южная сторона)
      'r130':      { x: -34, z: 35,  label: 'Ауд. 130' },

    function makeLabelTexture(text, sub = '', bg = '#ffffff', fg = '#0f1418') {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = bg; ctx.fillRect(0, 0, 256, 256);
      ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `900 ${sub ? 100 : 112}px Inter, sans-serif`;
      ctx.fillText(text || '', 128, sub ? 105 : 128);
      if (sub) {
        ctx.font = '700 34px Inter, sans-serif';
        ctx.fillStyle = '#5a6470';
        ctx.fillText(sub, 128, 196);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.anisotropy = 4;
      return tex;
    }

    function extWindows(axis, fixed, from, to, normal, floors = FLOORS, skip = []) {
      const STEP = 4.2, WW = 2.3, WH = 2.7;
      const span = to - from;

       ============================================================ */
    const adj = {};
    EDGES.forEach(([a, b]) => {
      if (!NODES[a] || !NODES[b]) return;
      const dx = NODES[a].x - NODES[b].x;
      const dz = NODES[a].z - NODES[b].z;
      const w  = Math.hypot(dx, dz);
      (adj[a] = adj[a] || []).push([b, w]);
      (adj[b] = adj[b] || []).push([a, w]);
    });

    function findPath(start, goal) {
      if (!NODES[start] || !NODES[goal]) return null;
      const dist = {}, prev = {}, queue = new Set(Object.keys(NODES));
      Object.keys(NODES).forEach(k => dist[k] = Infinity);
      dist[start] = 0;
      while (queue.size) {
        let u = null, best = Infinity;
        queue.forEach(k => { if (dist[k] < best) { best = dist[k]; u = k; } });
        if (u === null || best === Infinity || u === goal) break;
        queue.delete(u);
        (adj[u] || []).forEach(([v, w]) => {
          if (!queue.has(v)) return;
          const alt = dist[u] + w;
          if (alt < dist[v]) { dist[v] = alt; prev[v] = u; }
        });
      }
      if (dist[goal] === Infinity) return null;
      const path = [];
      let cur = goal;
      while (cur != null) { path.unshift(cur); cur = prev[cur]; }
      return path;
    }

      const g = new THREE.Group();
      const suit  = new THREE.MeshStandardMaterial({ color: 0x003fb1, roughness: 0.6 });
      const skin  = new THREE.MeshStandardMaterial({ color: 0xf2c090, roughness: 0.7 });
      const pants = new THREE.MeshStandardMaterial({ color: 0x1c2836, roughness: 0.7 });

      const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.26, 0.55, 4, 10), suit);
      torso.position.y = 1.05; torso.castShadow = true;

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 14, 14), skin);
      head.position.y = 1.62; head.castShadow = true;

      // Конечности с шарниром сверху — качаются при ходьбе
      const mkLimb = (mat, len, r) => {
        const pivot = new THREE.Group();
        const m = new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 4, 8), mat);
        m.position.y = -(len / 2 + r);
        m.castShadow = true;
        pivot.add(m);
        return pivot;
      };
      const legL = mkLimb(pants, 0.42, 0.10); legL.position.set( 0.14, 0.72, 0);
      const legR = mkLimb(pants, 0.42, 0.10); legR.position.set(-0.14, 0.72, 0);
      const armL = mkLimb(suit,  0.36, 0.07); armL.position.set( 0.36, 1.30, 0);
      const armR = mkLimb(suit,  0.36, 0.07); armR.position.set(-0.36, 1.30, 0);

      g.add(torso, head, legL, legR, armL, armR);
      g.userData.limbs = { legL, legR, armL, armR };
      return g;
    }

    function clearRoute() {
      if (routeLine) { buildingGroup.remove(routeLine); routeLine = null; }
      routeMarkers.forEach(m => buildingGroup.remove(m));
      routeMarkers = [];
      if (avatar) { buildingGroup.remove(avatar); avatar = null; }
      stepCard.classList.remove('show');
      routeSteps = []; currentStep = 0;
    }

    function drawRoute(path) {
      clearRoute();
      if (!path || path.length < 2) return;
      const pts = path.map(id => new THREE.Vector3(NODES[id].x, 0.55, NODES[id].z));
      const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal');
      const tubeGeo = new THREE.TubeGeometry(curve, pts.length * 10, 0.32, 8, false);
      routeLine = new THREE.Mesh(tubeGeo, MAT.route);
      buildingGroup.add(routeLine);

      const startMk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.7, 0.7, 0.28, 24),
        new THREE.MeshStandardMaterial({ color: 0x1aa57a, emissive: 0x1aa57a, emissiveIntensity: 0.6 })
      );
      startMk.position.copy(pts[0]); startMk.position.y = 0.2;
      buildingGroup.add(startMk); routeMarkers.push(startMk);

      const endMk = new THREE.Mesh(
        new THREE.ConeGeometry(0.9, 2.4, 16),
        new THREE.MeshStandardMaterial({ color: 0xcc1830, emissive: 0xcc1830, emissiveIntensity: 0.5 })
      );
      endMk.position.copy(pts[pts.length - 1]); endMk.position.y = 1.4;
      buildingGroup.add(endMk); routeMarkers.push(endMk);

      // Аватар-человечек
      avatar = makePerson();
      avatar.position.copy(pts[0]);
      avatar.position.y = 0;
      buildingGroup.add(avatar);
      walkDist = 0;

      buildSteps(path, pts);
      showStep(0);
    }

    function buildSteps(path, pts) {
      routeSteps = [];
      for (let i = 0; i < path.length; i++) {
        const node = NODES[path[i]];
        let dir = 'straight', text = `Идите: ${node.label}`;
        if (i === 0) { text = `Старт: ${node.label}`; dir = 'flag'; }
        else if (i === path.length - 1) { text = `Финиш: ${node.label}`; dir = 'place'; }
        else {
          const a = pts[i - 1], b = pts[i], c = pts[i + 1] || b;
          const v1 = new THREE.Vector3().subVectors(b, a);
          const v2 = new THREE.Vector3().subVectors(c, b);
          const cross = v1.x * v2.z - v1.z * v2.x;
          if (v1.angleTo(v2) > 0.38) {
            dir = cross > 0 ? 'turn_left' : 'turn_right';
            text = `Поверните ${cross > 0 ? 'налево' : 'направо'} (${node.label})`;
          } else {
            text = `Прямо · ${node.label}`;
          }
        }
        const dist = i > 0 ? pts[i].distanceTo(pts[i - 1]) : 0;
        routeSteps.push({
          text, dir,
          meta: dist > 0 ? `${dist.toFixed(1)} м · шаг ${i}/${path.length - 1}` : 'Начало маршрута'
        });
      }
    }

    /* ============================================================
       UI
       ============================================================ */
    const fromInput = document.getElementById('from-input');
    const toInput   = document.getElementById('to-input');
    const rowFrom   = document.getElementById('row-from');
    const rowTo     = document.getElementById('row-to');
    const stepCard  = document.getElementById('step-card');
    const stepText  = document.getElementById('step-text');
    const stepMeta  = document.getElementById('step-meta');
    const stepIcon  = document.getElementById('step-icon');
    const toast     = document.getElementById('toast');

    let activeField = 'to';
    fromInput.addEventListener('focus', () => { activeField = 'from'; rowFrom.classList.add('focused'); rowTo.classList.remove('focused'); });
    toInput.addEventListener('focus',   () => { activeField = 'to';   rowTo.classList.add('focused'); rowFrom.classList.remove('focused'); });

    function resolveQuery(q) {
      if (!q) return null;
      const k = q.toLowerCase().trim();
      if (NODES[k]) return k;
      if (ALIASES[k]) return ALIASES[k];
      for (const id in NODES) if (NODES[id].label.toLowerCase().includes(k)) return id;
      return null;
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function buildRoute() {
      const fromId = resolveQuery(fromInput.value) || 'entrance';
      const toId   = resolveQuery(toInput.value);
      if (!toInput.value.trim()) { showToast('Укажите, куда идти'); toInput.focus(); return; }
      if (!toId) { showToast('Не нашли: «' + toInput.value + '»'); return; }
      const path = findPath(fromId, toId);
      if (!path) { showToast('Путь не найден'); return; }
      if (viewMode === 'ext') setView('iso');
      drawRoute(path);
      showToast(`${NODES[fromId].label} → ${NODES[toId].label}`);
      stepCard.classList.add('show');
    }

    document.getElementById('btn-route').addEventListener('click', buildRoute);
    document.getElementById('btn-swap').addEventListener('click', () => {
      const t = fromInput.value; fromInput.value = toInput.value; toInput.value = t;
    });
    [fromInput, toInput].forEach(inp => inp.addEventListener('keydown', e => { if (e.key === 'Enter') buildRoute(); }));

    document.querySelectorAll('.room-chip').forEach(btn => btn.addEventListener('click', () => {
      const id = btn.dataset.room;
      const node = NODES[id];
      if (!node) return;
      if (activeField === 'from') fromInput.value = node.label;
      else toInput.value = node.label;
      flyTo(node.x, node.z);
    }));

    const STEP_ICONS = { straight:'straight', turn_left:'turn_left', turn_right:'turn_right', flag:'flag', place:'place' };

    function showStep(i) {
      if (!routeSteps.length) return;
      currentStep = Math.max(0, Math.min(routeSteps.length - 1, i));
      const s = routeSteps[currentStep];
      stepText.textContent = s.text;
      stepMeta.textContent = s.meta;
      stepIcon.textContent = STEP_ICONS[s.dir] || 'straight';
    }

    document.getElementById('step-prev').addEventListener('click', () => showStep(currentStep - 1));
    document.getElementById('step-next').addEventListener('click', () => showStep(currentStep + 1));
    document.getElementById('step-close').addEventListener('click', () => stepCard.classList.remove('show'));

    /* ─── Режимы вида ─── */
    function animateCamera(pos, look, dur = 750) {
      const start = camera.position.clone();
      const startT = controls.target.clone();
      const t0 = performance.now();
      function step() {
        const t = Math.min(1, (performance.now() - t0) / dur);
        const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        camera.position.lerpVectors(start, new THREE.Vector3(pos.x, pos.y, pos.z), e);
        controls.target.lerpVectors(startT, new THREE.Vector3(look.x, look.y, look.z), e);
        controls.update();
        if (t < 1) requestAnimationFrame(step);
      }
      step();
    }

    let viewMode = 'ext';

    /* Показ/скрытие внутренней планировки (и маршрута на ней) */
    function setInteriorVisible(v) {
      modelGroup.visible = v;
      if (!v) roofGroup.visible = false;
      if (routeLine) routeLine.visible = v;
      routeMarkers.forEach(m => m.visible = v);
      if (avatar) avatar.visible = v;
    }

    function setView(mode) {
      viewMode = mode;
      document.querySelectorAll('.view-modes button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
      controls.enabled = (mode !== 'walk');
      const ext = (mode === 'ext');
      exteriorGroup.visible = ext;
      setInteriorVisible(!ext);
      if (ext) animateCamera({ x: 120, y: 92, z: 150 }, { x: -4, y: 6, z: 6 });
      if (mode === 'iso')  animateCamera({ x: 0, y: 110, z: 138 }, { x: 0, y: 0, z: -4 });
      if (mode === 'top')  animateCamera({ x: 0, y: 215, z: 8 }, { x: 0, y: 0, z: -4 });
      if (mode === 'walk') {
        // Если маршрута нет — строим демо-маршрут, чтобы было за кем идти
        if (!routeLine) {
          if (!toInput.value.trim()) { fromInput.value = 'Главный вход'; toInput.value = 'Деканат 105'; }
          buildRoute();
        }
        // Камеру подхватит animateAvatar — она плавно «прилетит» за спину человеку
      }
    }
    document.querySelectorAll('.view-modes button').forEach(b => b.addEventListener('click', () => setView(b.dataset.mode)));

    function flyTo(x, z) {
      animateCamera({ x: x + 12, y: 22, z: z + 18 }, { x, y: 1, z });
    }

    document.getElementById('btn-zoom-in').addEventListener('click',  () => { camera.zoom = Math.min(3, camera.zoom * 1.18); camera.updateProjectionMatrix(); });
    document.getElementById('btn-zoom-out').addEventListener('click', () => { camera.zoom = Math.max(0.3, camera.zoom / 1.18); camera.updateProjectionMatrix(); });
    document.getElementById('btn-reset').addEventListener('click', () => { camera.zoom = 1; camera.updateProjectionMatrix(); setView('iso'); });
    document.getElementById('btn-roof').addEventListener('click', () => {
      if (viewMode === 'ext') { setView('iso'); return; }   // из экстерьера — к плану этажа
      roofGroup.visible = !roofGroup.visible;
    });

    /* ─── Клик по объекту ─── */
    const raycaster = new THREE.Raycaster();
    const mouse2 = new THREE.Vector2();
    canvas.addEventListener('click', e => {
      const r = canvas.getBoundingClientRect();
      mouse2.x = ((e.clientX - r.left) / r.width) * 2 - 1;
      mouse2.y = -((e.clientY - r.top) / r.height) * 2 + 1;
      raycaster.setFromCamera(mouse2, camera);
      const hits = raycaster.intersectObjects(interactiveMeshes, false);
      if (!hits.length) return;
      const data = hits[0].object.userData;
      if (!data || !data.id) return;
      const node = NODES[data.id];
      if (!node) return;
      if (activeField === 'from') { fromInput.value = node.label; activeField = 'to'; rowFrom.classList.remove('focused'); rowTo.classList.add('focused'); }
      else { toInput.value = node.label; }
      showToast(`Выбрано: ${node.label}`);
    });

    /* ─── Анимация аватара + камера от третьего лица (ходьба) ─── */
    let walkDist = 0;
    const WALK_SPEED = 3.0; // м/с

    function animateAvatar(dt) {
      if (!avatar || !routeLine) return;
      const curve = routeLine.geometry.parameters?.path;
      if (!curve?.getPointAt) return;

      const L = curve.getLength();
      walkDist += dt * WALK_SPEED;
      const t = (walkDist % L) / L;
      const p = curve.getPointAt(t);
      avatar.position.set(p.x, 0, p.z);
      const tan = curve.getTangentAt(Math.min(0.999, t));
      avatar.rotation.y = Math.atan2(tan.x, tan.z);

      // Махи ногами и руками в такт шагам
      const s = Math.sin(walkDist * 3.6) * 0.55;
      const { legL, legR, armL, armR } = avatar.userData.limbs;
      legL.rotation.x =  s;        legR.rotation.x = -s;
      armL.rotation.x = -s * 0.7;  armR.rotation.x =  s * 0.7;

      // Режим «Ходьба»: камера плавно следует за человеком со спины
      if (viewMode === 'walk') {
        const camPos = new THREE.Vector3(p.x - tan.x * 7.5, 3.6, p.z - tan.z * 7.5);
        camera.position.lerp(camPos, 0.06);
        controls.target.lerp(new THREE.Vector3(p.x + tan.x * 2, 1.3, p.z + tan.z * 2), 0.1);
      }
    }

    /* ─── Resize + Render loop ─── */
    function resize() {
      const r = canvas.getBoundingClientRect();
      renderer.setSize(r.width, r.height, false);
      camera.aspect = r.width / r.height;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.1, (now - last) / 1000);
      last = now;
      controls.update();
      animateAvatar(dt);
      flag.rotation.y = Math.sin(now * 0.0012) * 0.18;
      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // Стартовый вид — внешний облик корпуса
    setView('ext');
    // Демо-маршрут наготове: появится при переходе в режим «План»
    setTimeout(() => {
      fromInput.value = 'Главный вход';
      toInput.value = 'Деканат 105';
      const path = findPath('entrance', 'r105');
      if (path) { drawRoute(path); setInteriorVisible(viewMode !== 'ext'); }
    }, 700);
  </script>
</body>
</html>
