<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Приложение, а не документ: масштаб зафиксирован, полосы вырезов
         учтены (viewport-fit=cover), interactive-widget не даёт клавиатуре
         ужимать вёрстку — иначе на телефоне страница «прыгала» в зуме. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0b1220" />
    <meta name="description" content="Навигация по корпусу ОҚМПУ им. Ө. Жәнібекова: 3D-карта этажа, поиск кабинетов и маршруты." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="UniMap AI" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>UniMap AI — 3D навигатор кампуса</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700&family=Unbounded:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
